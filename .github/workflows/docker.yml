name: Docker

on:
  workflow_dispatch:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Gradle
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-buildkit
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-v1-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/**', 'libs/*.jar') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-v1-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/**', 'libs/*.jar') }}-
            ${{ runner.os }}-${{ runner.arch }}-gradle-v1-

      # The GHA layer cache does not include RUN cache mounts.
      # This post step extracts Gradle's cache before actions/cache saves it.
      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {"${{ runner.temp }}/gradle-buildkit": "/root/.gradle"}
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          skip-extraction: ${{ steps.gradle-cache.outputs.cache-hit == 'true' }}

      - name: Login
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
